<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boya Sơ cấp 1 · Luyện nói</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: white;
      border-radius: 24px;
      padding: 45px 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      color: #5b4bb7;
    }

    .subtitle {
      margin: 12px 0 35px;
      color: #666;
      font-size: 17px;
    }

    .lessons {
      display: grid;
      gap: 16px;
    }

    .lesson {
      display: block;
      padding: 20px;
      background: #f3f0ff;
      border-radius: 16px;
      text-decoration: none;
      color: #333;
      transition: 0.2s;
    }

    .lesson:hover {
      transform: translateY(-2px);
      background: #eae5ff;
    }

    .lesson-title {
      font-size: 21px;
      font-weight: bold;
      color: #5b4bb7;
      margin-bottom: 6px;
    }

    .lesson-desc {
      font-size: 14px;
      color: #777;
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Boya Sơ cấp 1</h1>

    <p class="subtitle">
      Luyện nói tiếng Trung theo giáo trình Boya
    </p>

    <div class="lessons">

      <a class="lesson" href="bai1/">
        <div class="lesson-title">📖 Bài 1 · 你好</div>
        <div class="lesson-desc">
          Luyện nói · Bài khóa · Từ vựng
        </div>
      </a>

    </div>

    <div class="footer">
      hoaiphuongHSK · Boya Sơ cấp 1
    </div>

  </div>

</body>
</html>
